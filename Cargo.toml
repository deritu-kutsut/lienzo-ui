[package]
name = "lienzo_ui"
version = "1.6.1"
edition = "2024"
description = "Lienzo UI: a visual editor for game interfaces that exports to Unity (uGUI, UI Toolkit, IMGUI)"
license = "MIT"
repository = "https://github.com/deritu-kutsut/lienzo-ui"
readme = "README.md"
publish = false

[[bin]]
name = "lienzo-ui"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
eframe = "0.37.0"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
getrandom = "0.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
rfd = "0.18.0"
rhai = { version = "1.27.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
ureq = "3"
webbrowser = "1"
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
strip = true
debug = false
# panic = "abort" is not used: the network/updater threads rely on a panic only ending that thread, not the whole editor.
