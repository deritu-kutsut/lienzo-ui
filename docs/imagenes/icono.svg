<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Lienzo UI</title>
  <defs>
    <linearGradient id="marco" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#F07F12"/>
    </linearGradient>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2233"/>
      <stop offset="1" stop-color="#10131E"/>
    </linearGradient>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC163"/>
      <stop offset="1" stop-color="#F28A1C"/>
    </linearGradient>
  </defs>

  <!-- Marco redondeado naranja y fondo azul noche -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#marco)"/>
  <rect x="26" y="26" width="204" height="204" rx="40" fill="url(#fondo)"/>

  <!-- Ventana del editor: barra superior y bloques de la interfaz -->
  <circle cx="64" cy="70" r="9" fill="#F3EEE6"/>
  <rect x="82" y="61" width="104" height="18" rx="9" fill="#F3EEE6"/>
  <rect x="56" y="94" width="58" height="42" rx="9" fill="#F3EEE6"/>
  <rect x="122" y="94" width="50" height="42" rx="9" fill="#F3EEE6"/>
  <rect x="56" y="144" width="58" height="42" rx="9" fill="#F3EEE6"/>
  <rect x="122" y="144" width="28" height="42" rx="9" fill="#F3EEE6"/>

  <!-- Pincel en diagonal -->
  <g transform="rotate(42 170 150)">
    <rect x="158" y="70" width="24" height="96" rx="12" fill="url(#mango)"/>
    <rect x="156" y="160" width="28" height="14" rx="4" fill="#9AA3BA"/>
    <path d="M156 174 h28 c2 18 -4 34 -14 44 c-10 -10 -16 -26 -14 -44 z" fill="#F3EEE6"/>
    <path d="M170 196 c-4 8 -4 16 0 22 c4 -6 4 -14 0 -22 z" fill="#C9C2B6"/>
  </g>
</svg>
